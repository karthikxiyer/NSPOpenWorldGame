name: Build and deploy

# Builds the map tiles from data/raw and the game bundle on every push.
# Deploys to GitHub Pages from the default branch (enable Pages with "Source: GitHub Actions").
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.tiles.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build map tiles
        id: tiles
        run: |
          if [ ! -f data/raw/meta.json ]; then
            echo "::warning::data/raw is empty. Run the 'Fetch OSM data' workflow first; skipping tiles and deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run build:tiles
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Typecheck and bundle
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && steps.tiles.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
