name: Fetch OSM data

# Downloads raw OpenStreetMap data for the Vasai-Virar belt and commits it to data/raw/.
# Re-run manually (Actions tab -> Fetch OSM data -> Run workflow) to refresh the map.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-osm.sh
      - .github/workflows/fetch-osm.yml

permissions:
  contents: write

concurrency:
  group: fetch-osm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download from Overpass
        run: ./scripts/fetch-osm.sh data/raw

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update OSM data for Vasai-Virar ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
